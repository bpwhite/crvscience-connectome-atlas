[workspace]
resolver = "2"
members = [
    "crates/atlas-core",
    "crates/atlas-io",
    "crates/atlas-render",
    "crates/atlas-cli",
    "crates/atlas-gui",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Bryan P. White <crvscience.com>"]
description = "Standalone 3D Brain & Multi-Scale Connectome Atlas Workstation in Safe Rust"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
glam = { version = "0.29", features = ["serde"] }
flate2 = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.31"
wgpu = "24.0"
png = "0.18"
rfd = "0.15"
thiserror = "2.0"
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
